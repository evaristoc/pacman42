[project]
name = "pacman42"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "ecarabal", email = "ecarabal@student.codam.nl" },
	{ name = "kfletter", email = "kfletter@student.codam.nl" }
]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
strict = false

[tool.flake8]
files = ["src"]
max-line-length = 127
exclude = [".git", "__pycache__", "build", "dist"]
select = ["E9", "F63", "F7", "F82", "E", "W", "F"]

[dependency-groups]
req = [
    "python-dotenv==1.2.2",
    "mazegenerator",
    "mlx"
]

dev = [
    "uv==0.12.5",
    "pyinstaller==6.11.0",
]

linters = [
    "flake8==7.0.0",
    "mypy==1.9.0",
]

test = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
mazegenerator = { path = "src/wheels/mazegenerator-2.1.0-py3-none-any.whl" }
mlx = { path = "src/wheels/mlx-2.4-py3-none-any.whl" }