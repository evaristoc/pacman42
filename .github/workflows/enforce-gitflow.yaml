name: Enforce GitFlow Branching Rules

on:
  pull_request:
    branches:
      - master

jobs:
  validate-branch:
    name: Validate PR Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check if source branch is development
        if: github.base_ref == 'master' && github.head_ref != 'development'
        run: |
          echo "❌ ERROR: Pull Requests directly to 'master' are only allowed from 'development'."
          echo "Current source branch: ${{ github.head_ref }}"
          exit 1

      - name: Success Message
        run: echo "✅ Branch validation passed. PR is from 'development' to 'master'."
