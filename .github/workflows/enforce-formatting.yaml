name: Code Quality (Linting)

on:
  #push:
  #  branches-ignore:
  #    - master
  pull_request:
    branches:
      - development
    # paths:
    #  - '.github/workflows/enforce-formatting.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actdions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install Selected Dependencies
        run: uv sync --group linters --group req
      - name: Run Flake8 Linter
        run: uv run flake8 src
      - name: Run Mypy Type Checker
        run: uv run mypy src
